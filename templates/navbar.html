{% load static %}

<nav class="navbar navbar-expand-lg bg-body-tertiary py-3 shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center handwriting-font fw-bold fs-3" href="{% url 'home' %}">
      <img src="{% static 'images/logo.png' %}" width="30" height="30" class="d-inline-block align-text-top me-2">
      BartoArts
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">About</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="{% url 'post_list' %}">Posts</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'post_drafts' %}">Drafts</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'post_archived' %}">Archived</a>
        </li>

        {% if user.is_authenticated %}
          <!-- Insert right here the views that are for logged in users -->
            <li class="nav-item">
              <a class="nav-link" href="{% url 'post_new' %}">New Post</a>
            </li>

          <li class="nav-item">
            <form action="{% url 'logout' %}" method="post">
              {% csrf_token %}
              <input type="submit" value="Log Out" class="btn btn-link nav-link">
            </form>
          </li>

        {% else %}
          <!-- Insert right here the views that are for logged out users -->
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Log In</a>
          </li>
           <li class="nav-item">
            <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
          </li>
        {% endif %}
      </ul>
      {% if user.is_authenticated %}
        <div class="d-flex" style="margin-right: 1rem;">
          <span class="badge text-bg-info">{{ user.username }}</span>

        </div>
      {% endif %}

    
    
      
    </div>
  </div>
</nav>

{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Password Reset
{% endblock %}

{% block content %}
    <div class="container">
        <h2 class="text-center">Reset Your Password</h2>
        <p class="text-center">Enter your email address and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" value="Reset my password" class="btn btn-warning">Send Reset Link</button>
        </form>
    </div>
{% endblock %}

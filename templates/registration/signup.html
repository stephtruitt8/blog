{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
Sign Up
{% endblock %}

{% block content %}
    <div class="container">
        <h2>Sign Up</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <input type="submit" value="Sign Up" class="btn btn-primary">
        </form>
    </div>

{% endblock %}

{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
Update Post
{% endblock %}

{% block content %}

<div class="container">
    <h2 class="text-center">Update Post</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Update" class="btn btn-primary">
    </form>
</div>


{% endblock %}

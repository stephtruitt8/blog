{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}

<div class="container">
    <h2>Delete Post</h2>
    <p>Are you sure you want to delete this post?</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Confirm Delete" class="btn btn-danger">
        <a href="{% url 'post_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>

{% endblock %}
